    <link rel="canonical" href="https://www.revesolutions.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rêve Solutions" />
    <meta property="og:title" content="Rêve Solutions: Websites Built and Managed for You" />

    <meta property="og:url" content="https://www.revesolutions.in/" />
    <meta property="og:image" content="https://www.revesolutions.in/images/reve-logo.jpg" />
